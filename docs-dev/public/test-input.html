<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Input Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      padding: 20px;
      background: #f5f5f5;
      font-size: 16px;
      min-height: 100vh;
    }
    h2 { margin: 24px 0 8px; font-size: 14px; color: #666; }
    input, textarea {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      border: 1px solid #dcdee0;
      border-radius: 8px;
      outline: none;
      margin-bottom: 12px;
      background: #fff;
      -webkit-appearance: none;
    }
    textarea { min-height: 120px; }
    input:focus, textarea:focus { border-color: #1677ff; }
  </style>
</head>
<body>
  <h2>Native &lt;input&gt; — no JS, no framework</h2>
  <input type="text" placeholder="Type here..." />

  <h2>Native &lt;textarea&gt; — no JS, no framework</h2>
  <textarea placeholder="Type here..."></textarea>

  <h2>Native &lt;input type=number&gt;</h2>
  <input type="number" placeholder="123" />

  <h2>Native &lt;input type=password&gt;</h2>
  <input type="password" placeholder="Password" />

  <div style="margin-top: 60px; color: #999; font-size: 12px; text-align: center;" id="ua"></div>
  <script>document.getElementById('ua').textContent = navigator.userAgent;</script>
</body>
</html>
